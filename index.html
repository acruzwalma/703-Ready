<script>
"use strict";
const {BLOCKS,GATES,blockFor,sessionsFor:baseSessions,T,iso,addDays,daysBetween,D}=window.PLAN;
const RACE='2027-10-16';
const SK='tri-703-v6';
// Call schedule from the Sam+Alex Google Calendar (pulled Oct 21 2026). Editable in Setup.
// Call days now come from your Google Calendar via the daily sync (encrypted). This list is only a manual fallback.
const CALL_DAYS=[];
// Predictions on record (written Oct 21 2026). kind: W, bpm, pct, lph, time (mm:ss or h:mm:ss), pace (/mi), css (/100m), cda
const PREDS=[
 
 {id:'ftp-nov',date:'2026-11-07',m:'FTP (0.95 × 20 min)',kind:'W',lo:190,hi:215,note:'Oct 18 docs predicted 160–180'},
 {id:'hr-nov',date:'2026-11-07',m:'Max HR in FTP test',kind:'bpm',lo:172,hi:184},
 {id:'5k-nov',date:'2026-11-14',m:'5K time trial',kind:'time',lo:22*60+45,hi:25*60+15},
 {id:'dur-nov',date:'2026-11-28',m:'Durability decrement',kind:'pct',lo:4,hi:12},
 {id:'ftp-feb',date:'2027-02-06',m:'FTP',kind:'W',lo:205,hi:220},
 {id:'ftp-g1',date:'2027-03-20',m:'Gate 1 FTP',kind:'W',lo:208,hi:222},
 {id:'5k-g1',date:'2027-03-21',m:'Gate 1 5K',kind:'time',lo:22*60+15,hi:23*60+45},
 {id:'oly-swim',date:'2027-04-10',m:'Pinehurst swim (International)',kind:'time',lo:24*60,hi:28*60,note:'no pool swims since October'},
 {id:'css-may',date:'2027-05-31',m:'Swim CSS (pool reopens)',kind:'css',lo:92,hi:108},
 {id:'oly-bike',date:'2027-04-10',m:'Pinehurst bike (rolling, ~40 km)',kind:'time',lo:76*60,hi:85*60,note:'rescale if the official distance differs'},
 {id:'oly-run',date:'2027-04-10',m:'Pinehurst run 10 km',kind:'time',lo:47*60+30,hi:51*60+30},
 {id:'ftp-g2',date:'2027-06-22',m:'Gate 2 FTP',kind:'W',lo:215,hi:228},
 {id:'10k-g2',date:'2027-06-26',m:'Gate 2 10K',kind:'time',lo:46*60,hi:48*60+30},
 {id:'sim-g3',date:'2027-09-04',m:'Gate 3 race-sim run pace',kind:'pace',lo:8*60+5,hi:8*60+35},
 {id:'race-swim',date:'2027-10-16',m:'Wilmington swim',kind:'time',lo:33*60+30,hi:36*60},
 {id:'race-tt',date:'2027-10-16',m:'Wilmington T1 + T2',kind:'time',lo:7*60+30,hi:10*60},
 {id:'race-bike',date:'2027-10-16',m:'Wilmington bike',kind:'time',lo:(2*60+52)*60,hi:(3*60+11)*60},
 {id:'race-run',date:'2027-10-16',m:'Wilmington run',kind:'time',lo:(1*60+48)*60,hi:(2*60+1)*60},
 {id:'race-total',date:'2027-10-16',m:'Wilmington finish',kind:'time',lo:(5*60+27)*60,hi:(5*60+52)*60,note:'central 5:39; P(sub-5:30) ≈ 16%'}
];
const DEFAULTS={ftp:200,ftpSource:'provisional (HR-derived, untested)',thrPace:485,css:96,lthr:163,rhr:49,hrmaxBike:180,hrmaxRun:187,callDays:CALL_DAYS};

// ── state ──
let S={settings:{...DEFAULTS},logs:{},fits:{},actuals:{},imported:{days:{},workouts:{}},updated:0};
let weekCache={};
let W={days:{},workouts:{},calls:null,cal:null}, IV=[], meta={whoop_connected:false,synced_at:null,remote:false,err:null};
let view='today', curDate=iso(new Date()), weekStart=null, msg='';
function key(){try{return localStorage.getItem('703-key')||''}catch(e){return ''}}
function lsGet(k){try{return localStorage.getItem(k)||''}catch(e){return ''}}
function load(){try{const d=localStorage.getItem(SK);if(d){const p=JSON.parse(d);S={...S,...p,settings:{...DEFAULTS,...(p.settings||{})}}}}catch(e){}}
function save(){S.updated=Date.now();try{localStorage.setItem(SK,JSON.stringify(S))}catch(e){}}
// Where the app lives on GitHub Pages: https://<owner>.github.io/<repo>/
const GH=(()=>{const h=location.hostname;if(!h.endsWith('.github.io'))return null;const owner=h.split('.')[0];const repo=location.pathname.split('/').filter(Boolean)[0]||'';
  return {owner,repo,raw:`https://raw.githubusercontent.com/${owner}/${repo}/main/data/whoop.enc.json`,wf:`https://github.com/${owner}/${repo}/actions/workflows/sync.yml`,redirect:`https://${h}/${repo}/callback.html`}})();
async function openBox(box,pass){const te=new TextEncoder();const ub=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
  const base=await crypto.subtle.importKey('raw',te.encode(pass),'PBKDF2',false,['deriveKey']);
  const k=await crypto.subtle.deriveKey({name:'PBKDF2',salt:ub(box.salt),iterations:200000,hash:'SHA-256'},base,{name:'AES-GCM',length:256},false,['decrypt']);
  return JSON.parse(new TextDecoder().decode(await crypto.subtle.decrypt({name:'AES-GCM',iv:ub(box.iv)},k,ub(box.ct))))}
async function pull(){
  if(!GH||!key()){meta.remote=false;render();return}
  try{const r=await fetch(GH.raw+'?t='+Date.now(),{cache:'no-store'});
    if(r.status===404){meta.remote=true;meta.whoop_connected=false;meta.err=null;render();return}
    if(!r.ok)throw new Error('GitHub returned '+r.status);
    const d=await openBox(await r.json(),key());
    W={days:d.days||{},workouts:d.workouts||{},calls:Array.isArray(d.calls)?d.calls:null,calls_synced:d.calls_synced||null,cal:d.cal||null};weekCache={};IV=d.intervals||[];meta.synced_at=d.synced_at;meta.whoop_connected=true;meta.remote=true;meta.err=null}
  catch(e){meta.err=e.name==='OperationError'?'Wrong passphrase: it has to match APP_PASSPHRASE in your GitHub secrets.':'Could not load Whoop data: '+e.message}
  render();
}
function connectWhoop(){const cid=lsGet('703-cid');if(!cid){alert('Paste your Whoop Client ID first, then Save.');return}if(!GH){alert('Connect Whoop only works from your GitHub Pages address.');return}
  const st=Array.from(crypto.getRandomValues(new Uint8Array(8)),b=>b.toString(16).padStart(2,'0')).join('');
  const u=new URL('https://api.prod.whoop.com/oauth/oauth2/auth');u.searchParams.set('client_id',cid);u.searchParams.set('redirect_uri',GH.redirect);u.searchParams.set('response_type','code');u.searchParams.set('scope','offline read:recovery read:sleep read:cycles read:workout read:profile');u.searchParams.set('state',st);
  location.href=u.toString().replace(/\+/g,'%20')}
// ── merged daily data (server Whoop + CSV import) ──
function days(){return {...S.imported.days,...W.days}}
function workouts(){return [...Object.values(S.imported.workouts||{}),...Object.values(W.workouts||{})]}
function typeOf(sport){const s=(sport||'').toLowerCase();
  if(/walk|golf|driv|gaming|sleep|^activity$|operations|meditat|manual/.test(s))return null;
  if(/triath/.test(s))return 'brick'; if(/run/.test(s))return 'run'; if(/swim/.test(s))return 'swim';
  if(/cycl|spin|bike|assault|ride/.test(s))return 'bike'; if(/strength|weight|functional|powerlift|hiit|pilates|yoga/.test(s))return 'strength'; return 'other'}

// ── Rules v1 (written Oct 21 2026, before testing; re-test at Gate 1) ──
function rulesFor(date){
  const dd=days(); const ln=d=>dd[d]&&dd[d].hrv>0?Math.log(dd[d].hrv):null;
  const prev=n=>{const o=[];for(let i=1;i<=n;i++)o.push(addDays(date,-i));return o};
  const mean=a=>a.reduce((s,v)=>s+v,0)/a.length; const sd=a=>{const m=mean(a);return Math.sqrt(a.reduce((s,v)=>s+(v-m)**2,0)/(a.length-1))};
  const b60=prev(60).map(ln).filter(v=>v!=null); const r60=prev(60).map(d=>dd[d]&&dd[d].rhr).filter(v=>v>0);
  const today=dd[date]||{}; const l=ln(date);
  if(b60.length<30||l==null) return {zone:'NONE',why:[b60.length<30?`Needs 30 days of HRV history (${b60.length} so far).`:'No Whoop recovery for this morning yet.'],vals:{}};
  const base=mean(b60), s=sd(b60), swc=0.5*s;
  const w7=[date,...prev(6)].map(ln).filter(v=>v!=null); const ln7=w7.length>=5?mean(w7):null;
  const rb=r60.length>=30?mean(r60):null; const rw=[date,...prev(6)].map(d=>dd[d]&&dd[d].rhr).filter(v=>v>0); const rhr7=rw.length>=5?mean(rw):null;
  const slp=today.sleep_h;
  const c={vlow:l<base-1.5*s, rhrHi:rb!=null&&today.rhr>=rb+7, short:slp!=null&&slp<4.5, low7:ln7!=null&&ln7<base-swc, rhr7Hi:rb!=null&&rhr7!=null&&rhr7>rb+3, todayLow:l<base-s, short55:slp!=null&&slp<5.5};
  const why=[]; let zone='GREEN';
  if([c.vlow,c.rhrHi,c.short].filter(Boolean).length>=2||(c.low7&&c.rhr7Hi)){zone='RED';
    if(c.vlow)why.push('HRV below baseline − 1.5 SD');if(c.rhrHi)why.push('Resting HR ≥ baseline + 7');if(c.short)why.push('Sleep under 4.5 h');if(c.low7&&c.rhr7Hi)why.push('7-day HRV below band and 7-day resting HR > baseline + 3')}
  else if(c.low7||c.todayLow||c.short55){zone='AMBER';
    if(c.low7)why.push('7-day HRV below the band');if(c.todayLow)why.push('HRV below baseline − 1 SD');if(c.short55)why.push('Sleep under 5.5 h')}
  else why.push('All inside normal range');
  return {zone,why,vals:{hrv:today.hrv,base:Math.exp(base),bandLo:Math.exp(base-swc),bandHi:Math.exp(base+swc),hrv7:ln7?Math.exp(ln7):null,rhr:today.rhr,rhrBase:rb,sleep:slp,recovery:today.recovery,thr1:Math.exp(base-s),thr15:Math.exp(base-1.5*s)}};
}
const ACTION={GREEN:'As planned.',AMBER:'Keep the duration, cap everything at Zone 2, and move the key session one day.',RED:'Rest, or 30 min Zone 1.',NONE:'Train as planned; the rules switch on once there is enough HRV history.'};

// ── load model (Whoop workouts → hrTSS-equivalent) ──
function loadSeries(){
  const st=S.settings; const ref=trimp(60,st.lthr,st);
  const byDay={}; workouts().forEach(w=>{if(!typeOf(w.sport)||!w.avg_hr||!w.min)return;byDay[w.date]=(byDay[w.date]||0)+trimp(w.min,w.avg_hr,st)/ref*100});
  const ds=Object.keys(byDay).sort(); if(!ds.length) return [];
  const out=[]; let ctl=0,atl=0; const k1=Math.exp(-1/42),k2=Math.exp(-1/7); const end=iso(new Date());
  for(let d=ds[0];d<=end;d=addDays(d,1)){const l=byDay[d]||0;ctl=ctl*k1+l*(1-k1);atl=atl*k2+l*(1-k2);out.push({d,load:l,ctl,atl})}
  return out;
}
function trimp(min,hr,st){const x=Math.max(0,Math.min(1,(hr-st.rhr)/(st.hrmaxRun-st.rhr)));return min*x*0.64*Math.exp(1.92*x)}

// ── matching done work to the plan ──
function doneFor(date){
  const c=[];
  workouts().filter(w=>w.date===date).forEach(w=>{const t=typeOf(w.sport);if(t)c.push({src:'Whoop',type:t,min:w.min,hr:w.avg_hr,label:w.sport})});
  IV.filter(a=>a.date===date).forEach(a=>{const t=typeOf(a.type);if(t)c.push({src:'Intervals',type:t,min:a.min,hr:a.avg_hr,w:a.avg_w,np:a.np,label:a.name||a.type})});
  (S.fits[date]||[]).forEach(f=>c.push({src:'FIT',type:'bike',min:f.durMin,hr:f.avgHR,w:f.avgP,np:f.NP,label:'FIT upload',fit:f}));
  return c;
}

// ── Calendar-aware plan: UDA shifts and trips move or swap sessions (agreed Oct 21 2026) ──
const DN=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
const dayName=d=>DN[D(d).getDay()];
function tripOn(d){const c=W.cal;if(!c)return null;const ign=S.settings.ignoreTrips||[];return (c.trips||[]).find(t=>d>=t.start&&d<=t.end&&!ign.includes(t.title+'|'+t.start))||null}
const udaOn=d=>W.cal&&W.cal.uda?W.cal.uda[d]||null:null;
const isRaceS=s=>/^RACE/.test(s.title)||s.test==='race'||s.test==='oly';
function asRun(s,st){const t=T(st);const m=Math.max(20,Math.min(s.key?85:60,Math.round(s.min*0.6/5)*5));
  return {type:'run',title:`Run ${m} (swapped from bike)`,min:m,key:s.key,intensity:s.intensity,swapped:true,
    detail:s.intensity?`Bike session swapped while away. Same idea on foot: warm up, then the hard parts at ${t.thr()} (about the same total hard minutes), easy jog between.`:`Bike session swapped while away. Easy ${t.easy()}.`}}
function weekPlan(mon){
  const key=mon+'|'+S.settings.ftp+'|'+S.settings.thrPace+'|'+(S.settings.ignoreTrips||[]).join(',');if(weekCache[key])return weekCache[key];
  const st=S.settings; const days=[0,1,2,3,4,5,6].map(i=>addDays(mon,i)); const P={};
  days.forEach(d=>P[d]={sessions:baseSessions(d,st).map(x=>({...x})),notes:[]});
  const canHost=(d,s)=>!udaOn(d)&&!(tripOn(d)&&(s.type==='bike'||s.type==='brick'));
  // away: bike → move (key) or run (non-key); strength → bodyweight; swim → only if there's a pool
  days.forEach(d=>{const t=tripOn(d);if(!t)return;P[d].notes.push(`Away: ${t.title}.`);
    P[d].sessions=P[d].sessions.map(x=>{if(isRaceS(x))return x;if(x.type==='bike'||x.type==='brick'){if(x.key){x._mv=1;return x}return asRun(x,st)}

const SRC_ORDER=['FIT','Intervals','Whoop'];

  const items=plan.map((s,i)=>{

function matchDay(date){
  let pool=[];
  for(let d=mondayOf(date);d<=date;d=addDays(d,1)){
    const {items,left}=matchRaw(d);
    items.forEach(x=>{ if(x.auto||x.manual) return;

  const hits=PREDS.filter(p=>S.actuals[p.id]!=null);const inr=hits.filter(p=>S.actuals[p.id]>=p.lo&&S.actuals[p.id]<=p.hi).length;
  const fits=Object.entries(S.fits).sort().reverse().slice(0,8);
  return `<div class="card"><h3>Upload a FIT file <span class="tiny faint">Edge 540, Zwift or TrainerRoad</span></h3><div class="drop" data-a="fit">Tap to choose .fit files. Power, HR, NP, best 20 min, decoupling and IF are computed here, on your phone.</div>
  ${fits.map(([d,arr])=>arr.map((f,j)=>`<div class="sess bike" style="margin-top:8px"><div class="t">${fd(d)} · ${Math.round(f.durMin)} min</div><div class="d mono">avg ${f.avgP?Math.round(f.avgP):'–'} W · NP ${f.NP?Math.round(f.NP):'–'} · best 20 ${f.b20?Math.round(f.b20):'–'} W${f.hr20?' @ '+Math.round(f.hr20)+' bpm':''} · avg HR ${f.avgHR?Math.round(f.avgHR):'–'} · max ${f.maxHR??'–'} · IF ${f.IF?f.IF.toFixed(2):'–'} · decoupling ${f.decouple!=null?f.decouple.toFixed(1)+'%':'–'}</div>
  <div class="row wrap" style="gap:6px;margin-top:6px">${f.b20?`<button class="btn sm pri" data-a="setftp" data-d="${d}" data-j="${j}">If this was a max test: FTP ${Math.round(f.b20*0.95)} W</button>`:''}<button class="btn sm" data-a="delfit" data-d="${d}" data-j="${j}">Remove</button></div></div>`).join('')).join('')}</div>
  <div class="card"><h3>Predictions on record <span class="tiny faint">${inr}/${hits.length} in range so far</span></h3><div class="tiny muted" style="margin-bottom:6px">Written Oct 21 2026, before each event. Enter the result; a miss says which part of the model is wrong.</div>
  <div style="overflow-x:auto"><table><tr><th>Date</th><th>Measure</th><th>Predicted</th><th>Actual</th><th></th></tr>${rows}</table></div></div>`;
}
function calExtras(){if(!W.cal)return '';const today=iso(new Date());const u=Object.keys(W.cal.uda||{}).filter(d=>d>=today).sort().slice(0,6);const ign=S.settings.ignoreTrips||[];const tr=(W.cal.trips||[]).filter(t=>t.end>=today).slice(0,8);
  return `<div class="tiny muted" style="margin-top:8px">UDA shifts: ${esc(u.map(fd).join(' · ')||'none')}. Their sessions move (Saturday → Sunday, and the long run → Friday).</div>
  <div class="tiny muted" style="margin-top:8px">Trips (bike sessions swap to runs or move home):</div>${tr.length?tr.map(t=>{const k=t.title+'|'+t.start;const off=ign.includes(k);return `<div class="row between tiny" style="margin-top:4px"><span style="${off?'text-decoration:line-through;opacity:.5':''}">${esc(t.title)} · ${fd(t.start)} – ${fd(t.end)}</span><button class="btn sm" data-a="togtrip" data-v="${esc(k)}">${off?'Count it':'Not a trip'}</button></div>`}).join(''):'<div class="tiny faint">none found</div>'}`}
function vSetup(){
  const st=S.settings;
  return `<div class="card"><h3>Connection</h3><div class="small muted" style="margin-bottom:8px">GitHub pulls your Whoop data every morning at 7. The passphrase has to match <b>APP_PASSPHRASE</b> in your repo's secrets. It stays on this device.</div>
  <label class="tiny muted">Passphrase<input id="k" type="password" value="${esc(key())}"></label>
  <label class="tiny muted" style="display:block;margin-top:8px">Whoop Client ID<input id="cid" value="${esc(lsGet('703-cid'))}"></label>
  <button class="btn pri" style="margin-top:8px" data-a="savekey">Save</button>
  <div class="row wrap" style="gap:6px;margin-top:10px"><button class="btn" data-a="connect">${meta.whoop_connected?'Reconnect Whoop':'Connect Whoop'}</button>${GH?`<a class="btn" href="${GH.wf}" target="_blank">Sync now (on GitHub)</a>`:''}<button class="btn" data-a="pull">Refresh</button></div>
  <div class="tiny muted" style="margin-top:8px">${GH?`Repo ${esc(GH.owner)}/${esc(GH.repo)}`:'Not on GitHub Pages: offline mode'} · Whoop ${meta.whoop_connected?'data loaded':'not connected yet'} · Intervals.icu ${IV.length?IV.length+' activities':'no data'}${msg?' · '+esc(msg):''}</div>
  ${GH?`<div class="tiny faint" style="margin-top:6px">Whoop redirect URL to register: ${esc(GH.redirect)}</div>`:''}</div>
  <div class="card"><h3>Thresholds <span class="tiny faint">${esc(st.ftpSource||'')}</span></h3><div class="grid3">
  ${[['ftp','FTP (W)'],['thrPaceTxt','Threshold pace (/mi)'],['cssTxt','CSS (/100 m)'],['lthr','LTHR (bpm)'],['rhr','Resting HR'],['hrmaxRun','Max HR run']].map(([k,l])=>`<label class="tiny muted">${l}<input data-set="${k}" value="${k==='thrPaceTxt'?mmss(st.thrPace):k==='cssTxt'?mmss(st.css):st[k]}"></label>`).join('')}</div>
  <div class="tiny muted" style="margin-top:6px">Every target in the plan is computed from these. After the 5K, threshold pace ≈ 5K pace + 20–25 s/mi.</div></div>
  <div class="card"><h3>Calendar</h3>${W.calls?`<div class="small">Synced from Google Calendar: <b>${W.calls.filter(d=>d>=iso(new Date())).length}</b> upcoming call days${W.calls_synced?' · updated '+new Date(W.calls_synced).toLocaleDateString('en-US',{month:'short',day:'numeric'}):''}.</div><div class="tiny muted" style="margin-top:4px">Next: ${esc(W.calls.filter(d=>d>=iso(new Date())).slice(0,6).map(d=>fd(d)).join(' · ')||'none')}</div>+calExtras()+`:`<div class="small muted" style="margin-bottom:6px">Not synced from Google Calendar yet (add the GCAL_ICS_URL secret). Manual list:</div><textarea id="calls" rows="3" class="mono tiny">${esc((st.callDays||[]).join(', '))}</textarea><button class="btn sm" style="margin-top:6px" data-a="savecalls">Save call days</button>`}</div>
  <div class="card"><h3>Import and backup</h3><div class="small muted" style="margin-bottom:8px">No server? Import Whoop's CSV export (physiological_cycles.csv and workouts.csv) to run the rules and the load chart offline.</div>
  <div class="row wrap" style="gap:6px"><button class="btn" data-a="csv">Import Whoop CSVs</button><button class="btn" data-a="export">Export backup</button><button class="btn" data-a="import">Restore backup</button><button class="btn" data-a="reset">Reset</button></div></div>`;
}
function render(){
  const body=view==='today'?vToday():view==='plan'?vPlan():view==='data'?vData():view==='tests'?vTests():vSetup();
  const tabs=[['today','📋','Today'],['plan','🗓','Plan'],['data','📈','Recovery'],['tests','🎯','Tests'],['setup','⚙️','Setup']];
  document.getElementById('app').innerHTML=header()+body+`<div class="nav">${tabs.map(([id,i,l])=>`<button class="${view===id?'act':''}" data-a="nav" data-v="${id}"><span class="i">${i}</span>${l}</button>`).join('')}</div>`;
}
// ── events ──
document.addEventListener('click',async e=>{
  const el=e.target.closest('[data-a]'); if(!el) return; const a=el.dataset.a, v=el.dataset.v, i=el.dataset.i;
  const lg=()=>{S.logs[curDate]=S.logs[curDate]||{};return S.logs[curDate]};
  if(a==='nav'){view=v;if(v==='plan')weekStart=null}
  else if(a==='day'){curDate=addDays(curDate,+v)}
  else if(a==='goto'){curDate=v;view='today'}
  else if(a==='wk'){weekStart=addDays(weekStart,+v)}
  else if(a==='done'){lg()[i]={...(lg()[i]||{}),status:'done'};save()}
  else if(a==='skip'){const n=prompt('Why skip? (optional)')||'';lg()[i]={status:'skip',note:n};save()}
  else if(a==='note'){const r=prompt('RPE 1–10 (optional)',lg()[i]?.rpe||'');const n=prompt('Note (optional)',lg()[i]?.note||'');lg()[i]={...(lg()[i]||{}),status:lg()[i]?.status||'done',rpe:r?+r:null,note:n||''};save()}
  else if(a==='clear'){delete lg()[i];save()}
  else if(a==='fit'){document.getElementById('fit-file').click();return}
  else if(a==='csv'){document.getElementById('csv-file').click();return}
  else if(a==='import'){document.getElementById('json-file').click();return}
  else if(a==='setftp'){const f=S.fits[el.dataset.d][+el.dataset.j];const ftp=Math.round(f.b20*0.95);S.settings.ftp=ftp;S.settings.ftpSource='tested '+el.dataset.d;
    const near=p=>Math.abs(daysBetween(p.date,el.dataset.d))<=3; const p=PREDS.find(p=>p.kind==='W'&&near(p));if(p)S.actuals[p.id]=ftp; const hp=PREDS.find(p=>p.kind==='bpm'&&near(p));if(hp&&f.maxHR)S.actuals[hp.id]=f.maxHR; save()}
  else if(a==='delfit'){S.fits[el.dataset.d].splice(+el.dataset.j,1);if(!S.fits[el.dataset.d].length)delete S.fits[el.dataset.d];save()}
  else if(a==='savekey'){try{localStorage.setItem('703-key',document.getElementById('k').value.trim());localStorage.setItem('703-cid',document.getElementById('cid').value.trim())}catch(e){}msg='Saved';await pull();return}
  else if(a==='connect'){connectWhoop();return}
  else if(a==='pull'){await pull();return}
  else if(a==='togtrip'){const L=S.settings.ignoreTrips=S.settings.ignoreTrips||[];const k=v;const ix=L.indexOf(k);if(ix>=0)L.splice(ix,1);else L.push(k);weekCache={};save()}
  else if(a==='savecalls'){S.settings.callDays=document.getElementById('calls').value.split(/[\s,]+/).filter(x=>/^\d{4}-\d\d-\d\d$/.test(x)).sort();save()}
  else if(a==='export'){const b=new Blob([JSON.stringify(S,null,2)],{type:'application/json'});const l=document.createElement('a');l.href=URL.createObjectURL(b);l.download='703ready-v2-'+iso(new Date())+'.json';l.click();return}
  else if(a==='reset'){if(confirm('Delete all app data on this device?')){S={settings:{...DEFAULTS},logs:{},fits:{},actuals:{},imported:{days:{},workouts:{}},updated:0};save()}}
  render();
});
document.addEventListener('change',e=>{
  const t=e.target;
  if(t.dataset.pred){const p=PREDS.find(x=>x.id===t.dataset.pred);const v=parseVal(p.kind,t.value);if(v==null)delete S.actuals[p.id];else S.actuals[p.id]=v;save();render()}
  if(t.dataset.set){const k=t.dataset.set;if(k==='thrPaceTxt'){const v=parseVal('pace',t.value);if(v)S.settings.thrPace=v}else if(k==='cssTxt'){const v=parseVal('css',t.value);if(v)S.settings.css=v}else{const v=parseFloat(t.value);if(!isNaN(v)){S.settings[k]=v;if(k==='ftp')S.settings.ftpSource='entered manually'}}save();render()}
});
document.getElementById('fit-file').addEventListener('change',async e=>{
  for(const f of e.target.files){try{const buf=await f.arrayBuffer();const s=summarizeFIT(parseFIT(buf),S.settings.ftp);if(!s){alert(f.name+': no records');continue}
    const d=iso(new Date(s.start));(S.fits[d]=S.fits[d]||[]).push(s)}catch(err){alert(f.name+': '+err.message)}}
  e.target.value='';save();render();
});
function parseCSV(text){const rows=[];let row=[],cur='',q=false;for(let i=0;i<text.length;i++){const c=text[i];if(q){if(c==='"'){if(text[i+1]==='"'){cur+='"';i++}else q=false}else cur+=c}else if(c==='"')q=true;else if(c===','){row.push(cur);cur=''}else if(c==='\n'||c==='\r'){if(c==='\r'&&text[i+1]==='\n')i++;row.push(cur);rows.push(row);row=[];cur=''}else cur+=c}if(cur||row.length){row.push(cur);rows.push(row)}
  const h=rows.shift()||[];return rows.filter(r=>r.length>1).map(r=>Object.fromEntries(h.map((k,i)=>[k.trim(),r[i]])))}
document.getElementById('csv-file').addEventListener('change',async e=>{
  let nd=0,nw=0;
  for(const f of e.target.files){const rows=parseCSV(await f.text());
    if(rows[0]&&'Heart rate variability (ms)' in rows[0]){rows.forEach(r=>{const w=(r['Wake onset']||'').slice(0,10);if(!w)return;S.imported.days[w]={hrv:+r['Heart rate variability (ms)']||null,rhr:+r['Resting heart rate (bpm)']||null,sleep_h:r['Asleep duration (min)']?+(+r['Asleep duration (min)']/60).toFixed(2):null,recovery:+r['Recovery score %']||null};nd++})}
    else if(rows[0]&&'Activity name' in rows[0]){rows.forEach((r,i)=>{const st=r['Workout start time'];if(!st)return;const id='csv-'+st+'-'+r['Activity name'];S.imported.workouts[id]={id,date:st.slice(0,10),start:st,sport:r['Activity name'],min:+r['Duration (min)']||0,avg_hr:+r['Average HR (bpm)']||null,max_hr:+r['Max HR (bpm)']||null};nw++})}}
  e.target.value='';msg=`Imported ${nd} days, ${nw} workouts`;save();render();
});
document.getElementById('json-file').addEventListener('change',async e=>{const f=e.target.files[0];if(!f)return;try{const d=JSON.parse(await f.text());if(confirm('Replace app data with this backup?')){S={...S,...d,settings:{...DEFAULTS,...(d.settings||{})}};save();render()}}catch(err){alert('Invalid backup file')}e.target.value=''});
load(); render(); pull();
</script>
</body>
